<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>网络连接错误</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }
        .error-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #374151;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 24px;
            color: #6b7280;
            max-width: 400px;
        }
        .retry-button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .retry-button:hover {
            background-color: #1d4ed8;
        }
        .server-chooser {
            margin-top: 16px;
            color: #4b5563;
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h1>网络连接问题</h1>
        <p>无法连接到 Memos 服务器。请检查您的网络连接，然后重试。</p>
        <button class="retry-button" id="retry-button">重新连接</button>
        <div class="server-chooser" id="server-chooser">选择其他服务器</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 重试按钮
            const retryButton = document.getElementById('retry-button');
            retryButton.addEventListener('click', function() {
                // 检查网络连接状态
                let networkAvailable = true;
                try {
                    networkAvailable = window.Android && window.Android.isNetworkAvailable();
                } catch (e) {
                    console.error('无法获取网络状态', e);
                }

                if (networkAvailable) {
                    // 回到主页
                    window.location.href = 'index.html';
                } else {
                    // 显示提示
                    try {
                        window.Android && window.Android.showToast('请检查网络连接');
                    } catch (e) {
                        alert('请检查网络连接');
                    }
                }
            });

            // 选择服务器
            const serverChooser = document.getElementById('server-chooser');
            serverChooser.addEventListener('click', function() {
                window.location.href = 'index.html#show-server-select';
            });
        });
    </script>
</body>
</html>
